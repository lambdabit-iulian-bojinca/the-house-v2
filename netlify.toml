# the-house-2026 — static single-page site, no build step.
# Deployed from the `the-house-2026` orphan branch of
# github.com/lambdabit-iulian-bojinca/the-house-v2

[build]
  publish = "."

# Serve the page at the site root without renaming the source file.
[[redirects]]
  from = "/"
  to = "/the-house-imobiliare-2026.html"
  status = 200

# Design "b" — brand-true rebuild. Served at /b so the two can be
# compared side by side without either claiming the root.
[[redirects]]
  from = "/b"
  to = "/the-house-imobiliare-2026-b.html"
  status = 200

# Redesign of the CMS listings screen, for the pitch. Real data, no back-end.
[[redirects]]
  from = "/admin"
  to = "/the-house-admin-2026.html"
  status = 200

# A pitch mock has no business in a search index. Headers match the REQUEST
# path, not the rewritten one, so /admin needs its own rule — the file path
# alone silently covered nothing.
[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/the-house-admin-2026.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Editor config lives in the repo but has no business being on the public site.
# (Dotfiles and netlify.toml are excluded by Netlify already; this one isn't.)
[[redirects]]
  from = "/the-house-2026.code-workspace"
  to = "/the-house-imobiliare-2026.html"
  status = 404
  force = true
